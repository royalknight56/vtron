name: Demo CI

on:
  push:
    tags:
      - demo**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-vtron-win
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install demo dependencies
        run: pnpm install --frozen-lockfile --filter vtron-demo... --ignore-scripts
      - name: Deploy win to Cloudflare
        run: pnpm -C packages/vtron-demo deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
